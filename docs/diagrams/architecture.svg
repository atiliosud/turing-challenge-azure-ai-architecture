<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="Inter, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
    <style>
      .b{fill:#fff;stroke:#222;stroke-width:1.2}
      .g{fill:#ececec;stroke:#222;stroke-width:1.2}
      .x{fill:#fff;stroke:#222;stroke-width:1.2;stroke-dasharray:4 3}
      .q{fill:#d6d6d6;stroke:#222;stroke-width:1}
      .t{font-size:12.5px;font-weight:600;fill:#111;text-anchor:middle}
      .s{font-size:10.5px;fill:#444;text-anchor:middle}
      .qt{font-size:10px;font-weight:600;fill:#111;text-anchor:middle}
      .l{stroke:#222;stroke-width:1.3;fill:none;marker-end:url(#a)}
      .d{stroke:#555;stroke-width:1.1;fill:none;stroke-dasharray:4 3}
      .zone{font-size:10.5px;font-weight:600;fill:#555;letter-spacing:.04em}
      .n{font-size:10px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>

  <!-- Row 1: edge -->
  <rect class="b" x="20" y="20" width="150" height="52" rx="4"/><text class="t" x="95" y="42">Cliente B2B</text><text class="s" x="95" y="58">OAuth2 client credentials</text>
  <rect class="g" x="205" y="20" width="165" height="52" rx="4"/><text class="t" x="287" y="42">Front Door Premium</text><text class="s" x="287" y="58">WAF · bots · DDoS L3/L4</text>
  <rect class="g" x="405" y="20" width="175" height="52" rx="4"/><text class="t" x="492" y="42">API Management v2</text><text class="s" x="492" y="58">JWT · productos · cuotas</text>
  <rect class="x" x="615" y="20" width="135" height="52" rx="4"/><text class="t" x="682" y="42">Entra ID</text><text class="s" x="682" y="58">tokens · app roles · MI</text>
  <path class="l" d="M170,46 H203"/><path class="l" d="M370,46 H403"/>
  <path class="d" d="M682,20 V10 H95 V20"/>

  <!-- VNet -->
  <rect x="10" y="95" width="745" height="258" rx="6" fill="#fafafa" stroke="#888" stroke-dasharray="6 4"/>
  <text class="zone" x="22" y="111">RED PRIVADA (VNet) · PRIVATE ENDPOINTS · MANAGED IDENTITY · SIN ACCESO PÚBLICO</text>

  <!-- Row 2: API -->
  <rect class="b" x="575" y="122" width="170" height="52" rx="4"/><text class="t" x="660" y="144">API .NET (Container Apps)</text><text class="s" x="660" y="160">POST → 202 + jobId · GET estado</text>
  <path class="l" d="M492,72 V90 H660 V120"/>

  <!-- Row 3: pipeline (right to left) -->
  <rect class="q" x="680" y="214" width="60" height="30" rx="3"/><text class="qt" x="710" y="233">cola pre</text>
  <rect class="b" x="515" y="201" width="145" height="56" rx="4"/><text class="t" x="587" y="224">Preprocesado</text><text class="s" x="587" y="240">Container Apps · ~2 s</text>
  <rect class="q" x="440" y="214" width="60" height="30" rx="3"/><text class="qt" x="470" y="233">cola IA</text>
  <rect class="g" x="255" y="201" width="170" height="56" rx="4"/><text class="t" x="340" y="224">Inferencia GPU · AKS</text><text class="s" x="340" y="240">T4 + Spot · KEDA · ~10 s</text>
  <rect class="q" x="180" y="214" width="60" height="30" rx="3"/><text class="qt" x="210" y="233">cola post</text>
  <rect class="b" x="20" y="201" width="145" height="56" rx="4"/><text class="t" x="92" y="224">Postprocesado</text><text class="s" x="92" y="240">Container Apps · ~3 s</text>
  <path class="l" d="M710,174 V212"/>
  <path class="l" d="M680,229 H662"/><path class="l" d="M515,229 H502"/><path class="l" d="M440,229 H427"/><path class="l" d="M255,229 H242"/><path class="l" d="M180,229 H167"/>

  <!-- Row 4: data -->
  <rect class="b" x="20" y="292" width="175" height="48" rx="4"/><text class="t" x="107" y="312">Blob Storage</text><text class="s" x="107" y="328">JSON + imágenes · lifecycle</text>
  <rect class="b" x="285" y="292" width="275" height="48" rx="4"/><text class="t" x="422" y="312">PostgreSQL Flexible + PostGIS</text><text class="s" x="422" y="328">150 M parcelas · jobs · outbox · ledger de uso</text>
  <rect class="b" x="590" y="292" width="150" height="48" rx="4"/><text class="t" x="665" y="312">Key Vault</text><text class="s" x="665" y="328">secretos · token Jira</text>
  <path class="d" d="M92,257 V290"/>
  <path class="d" d="M540,257 V290"/>
  <path class="d" d="M620,257 V276 H825 V259"/>

  <!-- External -->
  <rect class="x" x="770" y="203" width="115" height="54" rx="4"/><text class="t" x="827" y="225">Google Maps</text><text class="s" x="827" y="241">externo · egress</text>

  <!-- Row 5: operations -->
  <rect class="b" x="20" y="378" width="205" height="50" rx="4"/><text class="t" x="122" y="399">App Insights + Log Analytics</text><text class="s" x="122" y="415">OpenTelemetry · informe mensual</text>
  <rect class="b" x="255" y="378" width="185" height="50" rx="4"/><text class="t" x="347" y="399">Azure Monitor</text><text class="s" x="347" y="415">alertas → Action Group</text>
  <rect class="g" x="470" y="378" width="175" height="50" rx="4"/><text class="t" x="557" y="399">Sonda E2E (ACA Job)</text><text class="s" x="557" y="415">cada 5 min, vía Front Door</text>
  <rect class="x" x="675" y="378" width="110" height="50" rx="4"/><text class="t" x="730" y="399">Jira</text><text class="s" x="730" y="415">incidencia única</text>
  <path class="l" d="M225,403 H253"/><path class="l" d="M645,403 H673"/>
  <path class="d" d="M122,353 V376"/>
</svg>
